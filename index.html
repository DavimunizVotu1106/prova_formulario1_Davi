<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Exemplos de Formulário em HTML</h1>
    <hr>
    <div class="exemplo1">
    <form method="get" action="#">
        <label>Exemplo 01</label>
        <P></P>
        <input type="text" name="nome" placeholder="Nome">
        <input type="email" name="email" placeholder="Email">
        <input type="tel" name="telefone" placeholder="Celular">
        <input type="password" name="senha" placeholder="Senha">
        <input type="submit" id="submit1" value="Cadastrar">
    </form>
    </div>

    <hr>
    <label>Exemplo 02</label>
    <P> </P>
    <textarea id="text1"></textarea>

    <hr>

    <label>Exemplo 03</label>
    <p></p>
    <div class="exemplo3">
    <form method="get" action="#">
    <fieldset>
        <legend>Formulário</legend>
        <label>Nome:</label>
        <input type="text" name="nome">
        <p></p>
        <label>Sexo:</label>
        <input type="radio" name="masculino">Masculino
        <input type="radio" name="feminino">Feminino
        <p></p>
        <label>País</label>
        <select>
        <option>Escolha uma opção</option>
        <option>Brasil</option>
        <option>Coreia do Sul</option>
        <option>Canadá</option>
        <option>Irlanda</option>
        </select>
        <p>
        <label>Mensagem:</label><br>
        <textarea id="text2"></textarea>
        <p></p>
        <input type="checkbox"><label>Assinar Newsletter?</label>
        <p></p>
        <input type="submit" id="submit2" value="Enviar">
    </fieldset>
    </form>
    </div>
    <hr>
    <label>Exemplo 04</label>
    <p></p>
    <form action="https://google.com/search" method="get">
    <input type="text" id="pesquisa" name="q">
    <input type="submit" id="pesquisa1" value="Clique para pesquisar">    
    </form>
    <hr>
    <label>Exemplo 05</label
        <p></p>
        <div class="exemplo5">
    <form method="get" action="#">
        <fieldset><legend>Selecione a cor que mais agrada?</legend>
        <input type="checkbox" name="cor" value="azul"><label>azul</label>
        <input type="checkbox" name="cor" value="vermelho"><label>vermelho</label>
        <input type="checkbox" name="cor" value="verde"><label>verde</label>
        <input type="checkbox" name="cor" value="amarelo"><label>amarelo</label>
        </fieldset>
    </form>
    </div>
</body>
</html>
